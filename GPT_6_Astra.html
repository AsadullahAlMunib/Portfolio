 'প্রোগ্রামিংয়ের ভিত্তি হিসেবে C নিয়ে শুরু করে এখন HTML, CSS, JavaScript, PHP, MySQL ও Laravel দিয়ে ওয়েব ডেভেলপমেন্ট শিখছি ও চর্চা করছি। যা শিখি, প্রকল্পের মাধ্যমে তা বাস্তবে কাজে লাগাই।',
